# Multi-Objective Scoring Weights (Configurable)
routing:
  weights:
    success: 0.60
    latency: 0.20
    cost: 0.10
    health: 0.10
  exploration_probability: 0.05

# Dynamic Circuit Breaker Configuration
circuit_breaker:
  failure_rate_threshold: 0.40       # Trip when rolling failure rate exceeds 40%
  minimum_transactions: 20           # Require at least 20 transactions before tripping
  recovery_timeout_seconds: 30       # Time in seconds before transitioning OPEN -> HALF_OPEN
  half_open_test_probability: 0.05   # Fraction of traffic sent to HALF_OPEN routes for health probing

# Route Health Rolling Statistics
health:
  rolling_window_size: 100           # Bounded deque size for tracking recent outcomes

# Traffic & Load Simulation Configuration
traffic:
  load_thresholds:
    low: 0.35                        # 0.00 - 0.35: LOW traffic
    moderate: 0.70                   # 0.35 - 0.70: MODERATE traffic
    high: 0.85                       # 0.70 - 0.85: HIGH traffic
    critical: 1.00                   # 0.85 - 1.00: CRITICAL overload
  latency_multiplier: 1.50           # Latency surge factor: base * (1 + multiplier * load)
  failure_rate_load_penalty: 0.15    # Added failure probability at peak load

# Intelligent Decision Policy Configuration
decision_policy:
  switch_success_threshold_delta: 0.05    # Switch route if alternate has >= 5% higher predicted success
  high_traffic_load_threshold: 0.75       # Route considered high traffic if load >= 0.75
  wait_retry_load_threshold: 0.88         # Suggest WAIT_AND_RETRY if all routes exceed 88% load
  wait_retry_duration_seconds: 15         # Simulated retry countdown duration
  alternative_method_uplift_threshold: 0.12 # Suggest alternative method if >= 12% higher success


